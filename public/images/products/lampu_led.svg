<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="light_beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_lamp)"/>

  <!-- LED Projector Biled Projector Headlamp -->
  <g transform="translate(140, 60)">
    <!-- Aluminum Heatsink cooling fins -->
    <rect x="0" y="25" width="40" height="70" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <line x1="8" y1="25" x2="8" y2="95" stroke="#1e293b" stroke-width="2"/>
    <line x1="16" y1="25" x2="16" y2="95" stroke="#1e293b" stroke-width="2"/>
    <line x1="24" y1="25" x2="24" y2="95" stroke="#1e293b" stroke-width="2"/>
    <line x1="32" y1="25" x2="32" y2="95" stroke="#1e293b" stroke-width="2"/>

    <!-- Mini Fan at rear -->
    <circle cx="20" cy="105" r="12" fill="#1e293b"/>
    <circle cx="20" cy="105" r="5" fill="#38bdf8"/>

    <!-- Lens Holder Shroud -->
    <path d="M 40 30 L 95 15 L 95 105 L 40 90 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

    <!-- Angel Eye Ring -->
    <ellipse cx="98" cy="60" rx="14" ry="46" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <ellipse cx="98" cy="60" rx="14" ry="46" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Glass Lens Sphere -->
    <ellipse cx="98" cy="60" rx="10" ry="38" fill="#e0f2fe" opacity="0.9" stroke="#bae6fd" stroke-width="1.5"/>
    <ellipse cx="102" cy="50" rx="4" ry="12" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Light Beam projection -->
  <polygon points="245,75 370,30 370,190 245,145" fill="url(#light_beam)"/>

  <!-- Badge / Tag -->
  <rect x="25" y="25" width="130" height="26" rx="6" fill="#0284c7"/>
  <text x="90" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">LAMPU & PENERANGAN</text>

  <!-- Title -->
  <text x="200" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">Lampu Utama LED Projector BILED 2.5 Inch</text>
  <text x="200" y="265" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">AES Turbo SE All Weather 55W White / Gold</text>
</svg>
