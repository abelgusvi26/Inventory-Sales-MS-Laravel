<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_chain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold_sprocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="chain_metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_chain)"/>

  <!-- Rear Sprocket Gold Gear -->
  <g transform="translate(135, 130)">
    <!-- Outer Gear Teeth (approximated with jagged polygon) -->
    <circle cx="0" cy="0" r="62" fill="url(#gold_sprocket)" stroke="#854d0e" stroke-width="2"/>
    
    <!-- Cutouts -->
    <circle cx="0" cy="0" r="42" fill="#1c1917"/>
    <!-- Spokes -->
    <rect x="-42" y="-4" width="84" height="8" fill="url(#gold_sprocket)"/>
    <rect x="-4" y="-42" width="8" height="84" fill="url(#gold_sprocket)"/>
    
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="22" fill="url(#gold_sprocket)" stroke="#713f12" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#1c1917"/>
    
    <!-- Mounting Bolt holes -->
    <circle cx="0" cy="-16" r="3" fill="#cbd5e1"/>
    <circle cx="16" cy="0" r="3" fill="#cbd5e1"/>
    <circle cx="0" cy="16" r="3" fill="#cbd5e1"/>
    <circle cx="-16" cy="0" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Drive Chain Links (SSS / DID Gold) -->
  <g transform="translate(225, 95)">
    <!-- Link 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="38" height="18" rx="9" fill="url(#gold_sprocket)" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="4" fill="url(#chain_metal)"/>
      <circle cx="29" cy="9" r="4" fill="url(#chain_metal)"/>
    </g>
    <!-- Link 2 -->
    <g transform="translate(24, 18)">
      <rect x="0" y="0" width="38" height="18" rx="9" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="4" fill="#1e293b"/>
      <circle cx="29" cy="9" r="4" fill="#1e293b"/>
    </g>
    <!-- Link 3 -->
    <g transform="translate(48, 36)">
      <rect x="0" y="0" width="38" height="18" rx="9" fill="url(#gold_sprocket)" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="4" fill="url(#chain_metal)"/>
      <circle cx="29" cy="9" r="4" fill="url(#chain_metal)"/>
    </g>
    <!-- Link 4 -->
    <g transform="translate(72, 54)">
      <rect x="0" y="0" width="38" height="18" rx="9" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="4" fill="#1e293b"/>
      <circle cx="29" cy="9" r="4" fill="#1e293b"/>
    </g>
  </g>

  <!-- Badge / Tag -->
  <rect x="25" y="25" width="125" height="26" rx="6" fill="#854d0e"/>
  <text x="87" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">RANTAI & GEAR SET</text>

  <!-- Title -->
  <text x="200" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">Gear Set + Rantai Gold 428-112L</text>
  <text x="200" y="265" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">SSS Racing / DID Japan CBR150 / MX King</text>
</svg>
