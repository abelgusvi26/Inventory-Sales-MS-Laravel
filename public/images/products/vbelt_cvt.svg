<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cvt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="belt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_cvt)"/>
  
  <!-- Pulley 1 (Drive Face) -->
  <circle cx="130" cy="140" r="48" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="130" cy="140" r="28" fill="#1e293b"/>
  <circle cx="130" cy="140" r="10" fill="#f59e0b"/>
  
  <!-- Pulley 2 (Driven Clutch) -->
  <circle cx="270" cy="140" r="40" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="270" cy="140" r="22" fill="#1e293b"/>
  <circle cx="270" cy="140" r="8" fill="#f59e0b"/>
  
  <!-- V-Belt Outline -->
  <path d="M 130 92 L 270 100 A 40 40 0 0 1 270 180 L 130 188 A 48 48 0 0 1 130 92 Z" fill="none" stroke="#ef4444" stroke-width="12" stroke-linejoin="round"/>
  <path d="M 130 92 L 270 100 A 40 40 0 0 1 270 180 L 130 188 A 48 48 0 0 1 130 92 Z" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Roller weights icons -->
  <circle cx="190" cy="125" r="9" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <circle cx="210" cy="125" r="9" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <circle cx="200" cy="142" r="9" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>

  <!-- Badge / Tag -->
  <rect x="25" y="25" width="130" height="26" rx="6" fill="#ef4444"/>
  <text x="90" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">TRANSMISI / CVT</text>
  
  <!-- Title -->
  <text x="200" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">V-Belt & Roller Kit Beat / Vario</text>
  <text x="200" y="265" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Honda Genuine Parts (AHM) OEM</text>
</svg>
