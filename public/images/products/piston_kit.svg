<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_piston" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2f"/>
    </linearGradient>
    <linearGradient id="piston_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_piston)"/>

  <!-- Piston body -->
  <g transform="translate(140, 60)">
    <!-- Dome crown -->
    <path d="M 10 40 Q 60 25 110 40 L 110 50 L 10 50 Z" fill="url(#piston_grad)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Piston ring grooves -->
    <rect x="10" y="50" width="100" height="5" fill="#1e293b"/>
    <rect x="10" y="58" width="100" height="5" fill="#1e293b"/>
    <rect x="10" y="66" width="100" height="6" fill="#1e293b"/>

    <!-- Piston Skirt -->
    <path d="M 10 75 L 110 75 L 110 130 Q 100 138 85 130 L 85 105 L 35 105 L 35 130 Q 20 138 10 130 Z" fill="url(#piston_grad)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Piston Pin Hole -->
    <circle cx="60" cy="90" r="14" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- Piston Rings Floating -->
  <g transform="translate(265, 80)">
    <!-- Ring 1 Top -->
    <ellipse cx="45" cy="20" rx="42" ry="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <line x1="85" y1="20" x2="89" y2="20" stroke="#0f172a" stroke-width="5"/>

    <!-- Ring 2 Second -->
    <ellipse cx="45" cy="45" rx="42" ry="14" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <line x1="85" y1="45" x2="89" y2="45" stroke="#0f172a" stroke-width="5"/>

    <!-- Piston Pin -->
    <rect x="15" y="75" width="60" height="20" rx="4" fill="url(#piston_grad)" stroke="#334155" stroke-width="2"/>
    <circle cx="20" cy="85" r="4" fill="#0f172a"/>
  </g>

  <!-- Badge / Tag -->
  <rect x="25" y="25" width="115" height="26" rx="6" fill="#e11d48"/>
  <text x="82" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">MESIN / PISTON</text>

  <!-- Title -->
  <text x="200" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">Piston Kit Set + Ring Seher</text>
  <text x="200" y="265" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">FIM Piston / AHM Ori Vario 160 / NMAX 155</text>
</svg>
