<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_shock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="spring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_shock)"/>

  <!-- Shock Absorber Left -->
  <g transform="translate(140, 50)">
    <!-- Top Eyelet Mount -->
    <circle cx="25" cy="20" r="16" fill="url(#gold)" stroke="#78350f" stroke-width="2"/>
    <circle cx="25" cy="20" r="7" fill="#0f172a"/>
    <!-- Top reservoir tank -->
    <rect x="42" y="15" width="26" height="55" rx="10" fill="url(#gold)" stroke="#78350f" stroke-width="1.5"/>
    <line x1="42" y1="30" x2="68" y2="30" stroke="#78350f" stroke-width="1.5"/>

    <!-- Shaft & Spring Coils -->
    <rect x="19" y="36" width="12" height="110" fill="#94a3b8"/>
    
    <!-- Coils -->
    <ellipse cx="25" cy="48" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="62" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="76" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="90" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="104" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="118" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>

    <!-- Bottom Eyelet Mount -->
    <circle cx="25" cy="150" r="15" fill="url(#gold)" stroke="#78350f" stroke-width="2"/>
    <circle cx="25" cy="150" r="6" fill="#0f172a"/>
  </g>

  <!-- Shock Absorber Right -->
  <g transform="translate(225, 50)">
    <!-- Top Eyelet Mount -->
    <circle cx="25" cy="20" r="16" fill="url(#gold)" stroke="#78350f" stroke-width="2"/>
    <circle cx="25" cy="20" r="7" fill="#0f172a"/>
    <!-- Top reservoir tank -->
    <rect x="-18" y="15" width="26" height="55" rx="10" fill="url(#gold)" stroke="#78350f" stroke-width="1.5"/>
    <line x1="-18" y1="30" x2="8" y2="30" stroke="#78350f" stroke-width="1.5"/>

    <!-- Shaft & Spring Coils -->
    <rect x="19" y="36" width="12" height="110" fill="#94a3b8"/>
    
    <!-- Coils -->
    <ellipse cx="25" cy="48" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="62" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="76" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="90" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="104" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>
    <ellipse cx="25" cy="118" rx="20" ry="7" fill="none" stroke="url(#spring)" stroke-width="7"/>

    <!-- Bottom Eyelet Mount -->
    <circle cx="25" cy="150" r="15" fill="url(#gold)" stroke="#78350f" stroke-width="2"/>
    <circle cx="25" cy="150" r="6" fill="#0f172a"/>
  </g>

  <!-- Badge / Tag -->
  <rect x="25" y="25" width="125" height="26" rx="6" fill="#10b981"/>
  <text x="87" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">SUSPENSI / SHOCK</text>

  <!-- Title -->
  <text x="200" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">Shockbreaker Tabung Belakang 330mm</text>
  <text x="200" y="265" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">RCB Racing Boy / Kayaba Zeto Series</text>
</svg>
